# Builds the Windows installer for the bridge on every change to bridge/, and tests it:
# the packaged .exe replays sample NMEA, then the installer is installed as a real service,
# checked over HTTP, and uninstalled again. Download it from the run's "Artifacts", or from a
# GitHub release when a tag like bridge-v0.2.0 is pushed.
name: Bridge installer

on:
  push:
    branches: [main]
    paths: ["bridge/**", ".github/workflows/bridge-installer.yml"]
    tags: ["bridge-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        run: |
          if ("${{ github.ref }}" -like "refs/tags/bridge-v*") { $v = "${{ github.ref_name }}".Substring(8) }
          else { $v = "0.1.${{ github.run_number }}" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Version $v"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r bridge/requirements.txt pyinstaller

      - name: Build tz-bridge.exe
        run: pyinstaller --noconfirm bridge/installer/tz-bridge.spec

      - name: Test the .exe (replay sample NMEA)
        run: |
          $p = Start-Process dist\tz-bridge\tz-bridge.exe -ArgumentList "--replay bridge\installer\smoke.nmea --rate 200 --port 8090" -PassThru -NoNewWindow
          Start-Sleep 6
          $s = Invoke-RestMethod http://127.0.0.1:8090/state.json
          Stop-Process $p
          Write-Host "lines $($s.stats.lines) targets $($s.targets.Count) sog $($s.own.sog)"
          if ($s.stats.lines -lt 100 -or $s.targets.Count -lt 1 -or -not $s.own.sog) { throw "The packaged bridge didn't decode the sample" }

      - name: Get WinSW (service wrapper)
        run: Invoke-WebRequest https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe -OutFile bridge\installer\tz-bridge-service.exe

      # com0com (virtual COM port pairs, GPL, by Vyacheslav Frolov), bundled unmodified as an optional
      # installer task. If SourceForge refuses the download, the installer is built without it.
      # Pinned to the zip's known SHA-256: a different file fails the build instead of being bundled.
      - name: Get com0com (signed 2.2.2.0, x64)
        env:
          COM0COM_SHA256: 3BC7313E8577774CE78CFF4D1C816FAF96CFA48C485BBCC5527D4569F7D5E373
        run: |
          $zip = "$env:RUNNER_TEMP\com0com.zip"
          # SourceForge turns away requests that claim to be a browser (403); a plain download tool gets the file.
          curl.exe -fsSL --retry 3 -A "Wget/1.21" -o $zip "https://downloads.sourceforge.net/project/com0com/com0com/2.2.2.0/com0com-2.2.2.0-x64-fre-signed.zip"
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Couldn't download com0com; building the installer without virtual COM ports"; exit 0 }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          Write-Host "com0com zip SHA-256: $hash"
          if ($hash -ne $env:COM0COM_SHA256) { Write-Host "::error::The com0com download doesn't match its pinned SHA-256 ($env:COM0COM_SHA256). Not bundling it."; exit 1 }
          Expand-Archive $zip "$env:RUNNER_TEMP\com0com" -Force
          Get-ChildItem -Recurse "$env:RUNNER_TEMP\com0com" | Select-Object FullName, Length | Format-Table -AutoSize
          $setup = Get-ChildItem -Recurse "$env:RUNNER_TEMP\com0com" -Filter "setup.exe" | Select-Object -First 1
          if (-not $setup) { Write-Host "::warning::No setup .exe in the com0com download"; exit 0 }
          $sig = Get-AuthenticodeSignature $setup.FullName
          Write-Host "Signature: $($sig.Status) by $($sig.SignerCertificate.Subject)"
          Copy-Item $setup.FullName bridge\installer\com0com-setup.exe
          Write-Host "Bundling $($setup.Name)"

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSION" bridge\installer\TZGlassesBridge.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist\*.exe

      - name: Test the installer (install, check the service, uninstall)
        run: |
          $setup = Get-ChildItem dist\TZ-Glasses-Bridge-Setup-*.exe | Select-Object -First 1
          # Virtual COM ports are tested in their own step below (a driver install can ask for approval).
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /MERGETASKS=!vcom" -Wait
          Start-Sleep 8
          $svc = Get-Service TZGlassesBridge
          Write-Host "Service: $($svc.Status) $($svc.StartType)"
          if ($svc.Status -ne "Running") { Get-Content "$env:ProgramData\TZ Glasses Bridge\logs\*" -ErrorAction SilentlyContinue; throw "Service isn't running" }
          if (-not (Invoke-WebRequest http://127.0.0.1:8080/settings).Content.Contains("TZ Bridge Settings")) { throw "No settings page" }
          $c = Invoke-RestMethod http://127.0.0.1:8080/api/config
          if (-not $c.editable) { throw "Settings should be editable from this PC" }
          $body = @{ inputs = @(@{ type = "udp"; port = 10150 }); web_port = 8080 } | ConvertTo-Json -Depth 4
          Invoke-RestMethod http://127.0.0.1:8080/api/config -Method Post -ContentType "application/json" -Body $body | Out-Null
          Start-Sleep 4
          $u = New-Object System.Net.Sockets.UdpClient
          $msg = [Text.Encoding]::ASCII.GetBytes("`$HEHDT,158.0,T*23`r`n")
          1..5 | ForEach-Object { $u.Send($msg, $msg.Length, "127.0.0.1", 10150) | Out-Null; Start-Sleep -Milliseconds 300 }
          $s = Invoke-RestMethod http://127.0.0.1:8080/state.json
          Write-Host "Heading after saving settings: $($s.own.hdg)"
          if ($s.own.hdg -ne 158) { throw "The service didn't pick up the new settings" }
          Get-NetFirewallRule -DisplayName "TZ Glasses Bridge" | Select-Object DisplayName, Enabled, Profile | Format-Table
          Start-Process "${env:ProgramFiles}\TZ Glasses Bridge\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait
          Start-Sleep 3
          if (Get-Service TZGlassesBridge -ErrorAction SilentlyContinue) { throw "Uninstall left the service behind" }
          Write-Host "Install, settings and uninstall all worked"

      # Installs the bundled com0com and makes a pair through the bridge's own Settings API, as the
      # Settings page does. Allowed to fail: GitHub's Windows machines may refuse a kernel driver.
      - name: Test virtual COM ports (com0com)
        if: hashFiles('bridge/installer/com0com-setup.exe') != ''
        continue-on-error: true
        timeout-minutes: 6
        run: |
          # The same two steps the installer runs: com0com's silent setup, then trusting its driver publisher.
          Start-Process bridge\installer\com0com-setup.exe -ArgumentList "/S" -Wait
          powershell -NoProfile -ExecutionPolicy Bypass -File bridge\installer\trust-com0com.ps1
          if ($LASTEXITCODE -ne 0) { throw "Couldn't trust com0com's driver publisher" }
          $setupc = @("${env:ProgramFiles(x86)}\com0com\setupc.exe", "${env:ProgramFiles}\com0com\setupc.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $setupc) { throw "com0com installed no setupc.exe" }
          Write-Host "setupc: $setupc"
          New-Item -ItemType Directory "$env:RUNNER_TEMP\vc" -Force | Out-Null
          '{"inputs": [], "web_port": 8092}' | Out-File -Encoding ascii "$env:RUNNER_TEMP\vc\config.json"
          $p = Start-Process dist\tz-bridge\tz-bridge.exe -ArgumentList "--config `"$env:RUNNER_TEMP\vc\config.json`"" -PassThru -NoNewWindow
          Start-Sleep 6
          $v = Invoke-RestMethod http://127.0.0.1:8092/api/vcom
          Write-Host "Before: installed $($v.installed), pairs $($v.pairs | ConvertTo-Json -Compress)"
          $add = Invoke-RestMethod http://127.0.0.1:8092/api/vcom -Method Post -ContentType "application/json" -Body '{"action": "add"}'
          Write-Host "Made pair: $($add.pair.a) <-> $($add.pair.b)"
          if ($add.pair.a -notmatch '^COM\d+$' -or $add.pair.b -notmatch '^COM\d+$') { throw "The new pair has no COM names" }
          # Data written into one end must come out of the other.
          $a = New-Object System.IO.Ports.SerialPort $add.pair.a, 38400; $b = New-Object System.IO.Ports.SerialPort $add.pair.b, 38400
          $b.ReadTimeout = 3000; $a.Open(); $b.Open()
          $a.Write("`$HEHDT,158.0,T*23`r`n"); $line = $b.ReadLine(); $a.Close(); $b.Close()
          Write-Host "Through the pair: $line"
          if ($line -notlike '*HEHDT*') { throw "Nothing came through the virtual pair" }
          Invoke-RestMethod http://127.0.0.1:8092/api/vcom -Method Post -ContentType "application/json" -Body (@{ action = "remove"; n = $add.pair.n } | ConvertTo-Json) | Out-Null
          Stop-Process $p
          Write-Host "Virtual COM ports work: pair made, data passed, pair removed"

      - uses: actions/upload-artifact@v4
        with:
          name: TZ-Glasses-Bridge-Setup-${{ env.VERSION }}
          path: dist/TZ-Glasses-Bridge-Setup-*.exe

      - name: Publish a release (tags only)
        if: startsWith(github.ref, 'refs/tags/bridge-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist\TZ-Glasses-Bridge-Setup-*.exe).FullName --title "TZ Glasses Bridge $env:VERSION" --notes "Windows installer for the TZ Glasses Bridge."
